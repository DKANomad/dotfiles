---
name: Lint

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  ansible-lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install ansible -r requirements-dev.txt
          ansible-galaxy collection install -r requirements.yml --force

      - name: Run ansible-lint
        run: ansible-lint

      - name: Syntax check
        run: ansible-playbook --syntax-check main.yml
