---
- name: "Cursor CLI | Ensure installer cache directory exists"
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.cache/dotfiles/installers"
    state: directory
    mode: "0755"

- name: "Cursor CLI | Download installer"
  ansible.builtin.get_url:
    url: https://cursor.com/install
    dest: "{{ ansible_user_dir }}/.cache/dotfiles/installers/cursor-install.sh"
    mode: "0755"

- name: "Cursor CLI | Install via native installer"
  ansible.builtin.command:
    cmd: /bin/bash "{{ ansible_user_dir }}/.cache/dotfiles/installers/cursor-install.sh"
  args:
    creates: "{{ ansible_env.HOME }}/.local/bin/agent"
