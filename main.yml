---
- name: DotFiles Config
  hosts: localhost
  connection: local

  pre_tasks:
    - name: Detect WSL
      ansible.builtin.import_tasks: pre_tasks/detect_wsl.yml
      tags:
        - always

    - name: Confirm Windows Powershell Execution Policy
      ansible.builtin.import_tasks: pre_tasks/powershell_executionpolicy.yml
      when: ansible_host_environment_is_wsl
      tags:
        - always

    - name: Detect Host User
      ansible.builtin.import_tasks: pre_tasks/whoami_wsl.yml
      when: ansible_host_environment_is_wsl
      tags:
        - always

    - name: Detect Host User
      ansible.builtin.import_tasks: pre_tasks/whoami.yml
      tags:
        - always

  tasks:
    - name: Validate profile input
      ansible.builtin.assert:
        that:
          - profile in ['personal', 'work']
        fail_msg: "Invalid profile '{{ profile }}'. Expected one of: personal, work."
      tags:
        - always

    - name: Set roles
      ansible.builtin.set_fact:
        run_roles: >-
          {{
            dotfiles_roles
            | selectattr('profiles', 'contains', profile)
            | map(attribute='name')
            | difference(exclude_roles | default([]))
          }}
      tags:
        - always

    - name: Run roles
      ansible.builtin.include_role:
        apply:
          tags:
            - "{{ roles_item }}"
        name: "{{ roles_item }}"
      loop_control:
        loop_var: roles_item
      with_items: "{{ run_roles }}"
      tags:
        - always
